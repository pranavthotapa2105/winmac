name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out-standalone
      - uses: actions/upload-artifact@v4
        with:
          name: WinMac-small-needs-dotnet8
          path: out/WinMac.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WinMac-standalone
          path: out-standalone/WinMac.exe
